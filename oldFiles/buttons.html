<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼儿园游戏按钮设计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #5a67d8;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 1.2em;
        }

        .button-group {
            margin-bottom: 50px;
        }

        .group-title {
            font-size: 1.5em;
            color: #4a5568;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 5px solid #5a67d8;
        }

        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 基础按钮样式 */
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            user-select: none;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        /* 主题色1 - 草莓红 */
        .btn-strawberry {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            animation: bounce 2s infinite;
        }

        /* 主题色2 - 蓝莓蓝 */
        .btn-blueberry {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            animation: wiggle 2s infinite;
        }

        /* 主题色3 - 柠檬黄 */
        .btn-lemon {
            background: linear-gradient(135deg, #f7b731, #feca57);
            animation: pulse 2s infinite;
        }

        /* 主题色4 - 葡萄紫 */
        .btn-grape {
            background: linear-gradient(135deg, #a55eea, #8854d0);
            animation: shake 2s infinite;
        }

        /* 主题色5 - 西瓜绿 */
        .btn-watermelon {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            animation: rotate 3s infinite;
        }

        /* 主题色6 - 橙子橙 */
        .btn-orange {
            background: linear-gradient(135deg, #fa8231, #fd9644);
            animation: float 3s infinite;
        }

        /* 禁用状态 */
        .btn:disabled,
        .btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            animation: none !important;
            filter: grayscale(50%);
        }

        .btn:disabled:hover,
        .btn.disabled:hover {
            transform: none !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
        }

        .btn:disabled::before,
        .btn.disabled::before {
            display: none;
        }

        /* 动画效果 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-3px) rotate(-1deg); }
            66% { transform: translateY(3px) rotate(1deg); }
        }

        /* 特殊样式按钮 */
        .btn-round {
            border-radius: 50px;
            padding: 20px 40px;
        }

        .btn-square {
            border-radius: 15px;
            padding: 20px 30px;
        }

        .btn-star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            width: 120px;
            height: 120px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-heart {
            clip-path: path('M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5 C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z');
            width: 100px;
            height: 100px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 图标和emoji样式 */
        .btn-icon {
            font-size: 1.5em;
        }

        .btn-emoji {
            font-size: 1.8em;
        }

        /* 大号按钮 */
        .btn-large {
            padding: 25px 50px;
            font-size: 1.5em;
        }

        /* 小号按钮 */
        .btn-small {
            padding: 10px 20px;
            font-size: 1em;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .buttons-row {
                justify-content: center;
            }
            
            .btn {
                font-size: 1em;
                padding: 12px 24px;
            }
            
            h1 {
                font-size: 2em;
            }
        }

        /* 装饰元素 */
        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: -1;
        }

        .decoration-1 {
            top: 10%;
            left: 5%;
            font-size: 3em;
            animation: float 4s infinite;
        }

        .decoration-2 {
            top: 20%;
            right: 10%;
            font-size: 2.5em;
            animation: bounce 3s infinite;
        }

        .decoration-3 {
            bottom: 20%;
            left: 10%;
            font-size: 2.8em;
            animation: wiggle 3.5s infinite;
        }

        .decoration-4 {
            bottom: 10%;
            right: 5%;
            font-size: 3.2em;
            animation: pulse 4s infinite;
        }
    </style>
</head>
<body>
    <!-- 装饰元素 -->
    <div class="decoration decoration-1">🌈</div>
    <div class="decoration decoration-2">⭐</div>
    <div class="decoration decoration-3">🎈</div>
    <div class="decoration decoration-4">🦄</div>

    <div class="container">
        <h1>🎮 幼儿园游戏按钮 🎮</h1>
        <p class="subtitle">专为小朋友设计的可爱按钮集合</p>

        <!-- 基础主题色按钮 -->
        <div class="button-group">
            <h2 class="group-title">🎨 六种主题色</h2>
            <div class="buttons-row">
                <button class="btn btn-strawberry">
                    <span class="btn-emoji">🍓</span>
                    草莓红
                </button>
                <button class="btn btn-blueberry">
                    <span class="btn-emoji">🫐</span>
                    蓝莓蓝
                </button>
                <button class="btn btn-lemon">
                    <span class="btn-emoji">🍋</span>
                    柠檬黄
                </button>
                <button class="btn btn-grape">
                    <span class="btn-emoji">🍇</span>
                    葡萄紫
                </button>
                <button class="btn btn-watermelon">
                    <span class="btn-emoji">🍉</span>
                    西瓜绿
                </button>
                <button class="btn btn-orange">
                    <span class="btn-emoji">🍊</span>
                    橙子橙
                </button>
            </div>
        </div>

        <!-- 不同尺寸按钮 -->
        <div class="button-group">
            <h2 class="group-title">📏 不同尺寸</h2>
            <div class="buttons-row">
                <button class="btn btn-strawberry btn-small">
                    <span class="btn-emoji">🐭</span>
                    小老鼠
                </button>
                <button class="btn btn-blueberry">
                    <span class="btn-emoji">🐰</span>
                    小兔子
                </button>
                <button class="btn btn-lemon btn-large">
                    <span class="btn-emoji">🐻</span>
                    大熊熊
                </button>
            </div>
        </div>

        <!-- 不同形状按钮 -->
        <div class="button-group">
            <h2 class="group-title">🔷 不同形状</h2>
            <div class="buttons-row">
                <button class="btn btn-strawberry btn-round">
                    <span class="btn-emoji">🌟</span>
                    圆圆的
                </button>
                <button class="btn btn-blueberry btn-square">
                    <span class="btn-emoji">📦</span>
                    方方的
                </button>
                <button class="btn btn-lemon btn-star">
                    <span class="btn-emoji">⭐</span>
                </button>
                <button class="btn btn-grape btn-heart">
                    <span class="btn-emoji">❤️</span>
                </button>
            </div>
        </div>

        <!-- 禁用状态按钮 -->
        <div class="button-group">
            <h2 class="group-title">🚫 禁用状态</h2>
            <div class="buttons-row">
                <button class="btn btn-strawberry disabled">
                    <span class="btn-emoji">🔒</span>
                    锁住了
                </button>
                <button class="btn btn-blueberry disabled">
                    <span class="btn-emoji">😴</span>
                    休息中
                </button>
                <button class="btn btn-lemon disabled">
                    <span class="btn-emoji">⏸️</span>
                    暂停中
                </button>
            </div>
        </div>

        <!-- 纯图标按钮 -->
        <div class="button-group">
            <h2 class="group-title">🎯 纯图标按钮</h2>
            <div class="buttons-row">
                <button class="btn btn-strawberry">
                    <span class="btn-emoji">🎮</span>
                </button>
                <button class="btn btn-blueberry">
                    <span class="btn-emoji">🎨</span>
                </button>
                <button class="btn btn-lemon">
                    <span class="btn-emoji">🎵</span>
                </button>
                <button class="btn btn-grape">
                    <span class="btn-emoji">📚</span>
                </button>
                <button class="btn btn-watermelon">
                    <span class="btn-emoji">🏃</span>
                </button>
                <button class="btn btn-orange">
                    <span class="btn-emoji">🎪</span>
                </button>
            </div>
        </div>

        <!-- 游戏功能按钮 -->
        <div class="button-group">
            <h2 class="group-title">🎲 游戏功能</h2>
            <div class="buttons-row">
                <button class="btn btn-strawberry btn-large">
                    <span class="btn-emoji">🚀</span>
                    开始游戏
                </button>
                <button class="btn btn-blueberry btn-large">
                    <span class="btn-emoji">🏆</span>
                    排行榜
                </button>
                <button class="btn btn-lemon btn-large">
                    <span class="btn-emoji">⚙️</span>
                    设置
                </button>
                <button class="btn btn-grape btn-large">
                    <span class="btn-emoji">🎁</span>
                    奖励
                </button>
            </div>
        </div>

        <!-- 学习按钮 -->
        <div class="button-group">
            <h2 class="group-title">📖 学习专区</h2>
            <div class="buttons-row">
                <button class="btn btn-watermelon">
                    <span class="btn-emoji">🔤</span>
                    认字母
                </button>
                <button class="btn btn-orange">
                    <span class="btn-emoji">🔢</span>
                    学数字
                </button>
                <button class="btn btn-strawberry">
                    <span class="btn-emoji">🎨</span>
                    涂颜色
                </button>
                <button class="btn btn-blueberry">
                    <span class="btn-emoji">🧩</span>
                    拼图游戏
                </button>
            </div>
        </div>
    </div>
</body>
</html>
